name: ZonData Incident Pipeline

workflows:
  news_monitor_ingest:
    description: "Ingesta y pre-filtrado rápido de titulares sin llamadas a APIs de Google"
    trigger: "Cron Schedule (Every 30 mins)"
    tasks:
      - run: python scrapers/rss_scraper.py --ingest-only
      - action: "Evaluar título y guardar en raw_articles como queued o ignored"

  news_processor:
    description: "Procesamiento diferido de la cola raw_articles (Llamadas a Gemini y Google Geocoding)"
    trigger: "Cron Schedule (Every 30 mins, desfase de 5 mins)"
    tasks:
      - run: python scrapers/rss_scraper.py --process-only
      - action: "Extraer dirección, vehículos y víctimas con Gemini"
      - action: "Geocodificar con Google Maps y enviar a Laravel /api/incidents"

  brand_compliance:
    description: "Asegurar consistencia visual y tamaño de popups"
    checks:
      - "Verificar que el popup no contenga descripción de texto plano"
      - "Comprobar el correcto coloreado de las badges en MapComponent"